apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostname-ip-app1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hostname-ip-app1
  template:
    metadata:
      labels:
        app: hostname-ip-app1
    spec:
      containers:
      - name: hostname-ip-app1
        image: swatikadam16/k8s-hostname-ip:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: hostname-ip-app1-service
spec:
  selector:
    app: hostname-ip-app1
  ports:
    - protocol: TCP
      port: 3000         # Port inside the cluster
      targetPort: 3000   # Container port
      nodePort: 32000 
  type: NodePort